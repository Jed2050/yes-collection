<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Admin · YES COLLECTION</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230A0A0A'/%3E%3Ctext x='50' y='66' font-family='Cinzel,serif' font-size='44' font-weight='700' text-anchor='middle' fill='%23D4AF37'%3EY%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body>

<main class="login-shell">
  <div class="login-card">
    <div class="login-brand">
      <div class="mark">Y</div>
      <div class="name">YES Collection</div>
    </div>

    <h1>Admin</h1>
    <p class="lede">Restricted access. Authorised personnel only.</p>

    <div id="alert" class="alert alert-error" style="display:none;"></div>

    <form id="login-form" autocomplete="on">
      <div class="field">
        <label for="user">Username</label>
        <input id="user" name="user" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit">
        <span id="submit-label">Sign In</span>
      </button>
    </form>
  </div>
</main>

<script>
const $f = document.getElementById('login-form');
const $a = document.getElementById('alert');
const $b = document.getElementById('submit');
const $l = document.getElementById('submit-label');

$f.addEventListener('submit', async (e) => {
  e.preventDefault();
  $a.style.display = 'none';
  $b.disabled = true;
  $l.innerHTML = '<span class="spinner"></span>';

  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        user: document.getElementById('user').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'Login failed');
    window.location.href = '/admin';
  } catch (err) {
    $a.textContent = err.message;
    $a.style.display = 'block';
    $b.disabled = false;
    $l.textContent = 'Sign In';
  }
});
</script>

</body>
</html>
